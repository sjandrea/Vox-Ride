name: Build macOS (AU + VST3)

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
  release:
    types: [published]   # a Release created on github.com gets the AU/VST3 zips attached
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upload the build to this existing Release tag (e.g. 1.0.0). Leave empty for a plain build."
        required: false
        default: ""

permissions:
  contents: write   # needed to publish a Release when a v* tag is pushed

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (universal arm64 + x86_64)
        run: cmake --build build --config Release --target VoxPilot_AU VoxPilot_VST3 -j 4

      - name: Sign (ad-hoc) and validate Audio Unit
        run: |
          COMP="$HOME/Library/Audio/Plug-Ins/Components/VoxPilot.component"
          VST3="$HOME/Library/Audio/Plug-Ins/VST3/VoxPilot.vst3"
          codesign --force --deep -s - "$COMP"
          codesign --force --deep -s - "$VST3"
          lipo -info "$COMP/Contents/MacOS/VoxPilot"
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Vxpl Sbau
          mkdir -p dist
          cp -R "$COMP" "$VST3" dist/
          cp README.md dist/
          (cd dist && ditto -c -k --keepParent VoxPilot.component ../VoxPilot-AU.zip \
                   && ditto -c -k --keepParent VoxPilot.vst3 ../VoxPilot-VST3.zip)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxPilot-macOS
          path: dist

      - name: Publish Release (releases, tags and manual runs with a tag)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          overwrite_files: true
          files: |
            VoxPilot-AU.zip
            VoxPilot-VST3.zip
